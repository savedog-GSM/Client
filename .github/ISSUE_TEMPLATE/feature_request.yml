name: 기능 추가 및 개선
description: 새로운 기능이나 개선 작업을 작성합니다.
title: "[feat] "
labels: [enhancement]
assignees: [jiwoo1222]
body:
  - type: textarea
    id: description
    attributes:
      label: 상세 내용
      description: 구현할 기능과 목적을 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      value: "- [ ] 기능 구현\n- [ ] 검증"
  - type: textarea
    id: extra
    attributes:
      label: 추가사항
